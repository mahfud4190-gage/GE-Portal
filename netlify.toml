[build]
  command = "npm --prefix netlify/functions install --omit=dev --ignore-scripts && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[context.production]
  publish = "dist"

[context.deploy-preview]
  publish = "dist"

[context.branch-deploy]
  publish = "dist"

[dev]
  framework = "#static"
  publish = "dist"
  port = 8888
  autoLaunch = false

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# Edition 1 Firebase-backed replacement routes. The legacy files remain in the
